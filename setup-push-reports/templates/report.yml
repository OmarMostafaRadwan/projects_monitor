name: Push report

# Ships a status report to the dashboard after every push.
#
# Two rules govern this file:
#   1. It must NEVER fail a build. A status tool that blocks deploys gets
#      deleted within a week, so every step is best-effort and the job is
#      continue-on-error.
#   2. A push must NEVER produce silence. If no report exists (a plain `git
#      push` with no Claude Code involvement), a stub is built from commit
#      metadata instead — a project that reports nothing is indistinguishable
#      from a project nobody is working on.

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build payload
        env:
          # Git data is UNTRUSTED input. A commit message containing a quote or
          # `$(...)` would execute as shell if interpolated directly into `run`.
          # Passing through env and reading with jq --arg keeps it inert.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          DEVELOPER: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
          # `gh` is preinstalled on GitHub runners but needs a token to call the
          # API. contents:read is enough for compare and commit lookups.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # This job is continue-on-error, so a failure here paints the job
          # green and the send step is simply skipped — a report vanishes with
          # nothing in the UI to say so. The trap makes that case loud.
          trap 'code=$?; if [ "$code" -ne 0 ]; then echo "::error::Build payload failed (exit $code) — no report was sent for this push."; fi' EXIT

          pushed_at="${PUSHED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          # GitHub sends +00:00 offsets; the dashboard accepts both, but keep it
          # to one shape so stored timestamps sort predictably.
          pushed_at="$(date -u -d "$pushed_at" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "$pushed_at")"

          # reports/report.json is a cumulative document; entries[0] is the
          # newest and is what this push reports.
          report_file="reports/report.json"
          use_fallback=1

          if [ -f "$report_file" ] && jq -e '.entries[0]' "$report_file" >/dev/null 2>&1; then
            use_fallback=0
          else
            echo "::notice::No usable reports/report.json — sending a fallback stub."
          fi

          # Files changed come from git, not from the report.
          #
          # The push event payload already lists them per commit, so this needs
          # no extra history fetch. Asking a model to recall which files it
          # touched trades a fact for a recollection — git already knows.
          #
          # Caveat: GitHub caps `commits` at 20 per push event. On a larger
          # push the list is partial, which is why an empty result falls back to
          # whatever the report claimed rather than overwriting it with nothing.
          files_json="[]"

          # Source of truth is GitHub's own view of the push. The compare API
          # covers every commit in the push (the event payload caps its `commits`
          # list, and in practice has come back empty here), and it needs no git
          # history — which matters because the checkout is shallow.
          if [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files_json="$(gh api "repos/${REPO}/compare/${BEFORE}...${COMMIT}" \
              --jq '[.files[]?.filename] | unique | .[0:200]' 2>/dev/null || echo "[]")"
            echo "Changed files from compare API: $(jq -r 'length' <<<"$files_json")."
          fi

          # New branch, or compare unavailable: ask about the head commit alone.
          if [ "$(jq -r 'length' <<<"$files_json" 2>/dev/null || echo 0)" -eq 0 ]; then
            files_json="$(gh api "repos/${REPO}/commits/${COMMIT}" \
              --jq '[.files[]?.filename] | unique | .[0:200]' 2>/dev/null || echo "[]")"
            echo "Changed files from commit API: $(jq -r 'length' <<<"$files_json")."
          fi

          # Last resort: the push event payload, which costs no API call.
          if [ "$(jq -r 'length' <<<"$files_json" 2>/dev/null || echo 0)" -eq 0 ] \
             && [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            files_json="$(jq -c '
              [ (.commits // [])[] | (.added // []), (.modified // []), (.removed // []) ]
              | flatten | unique | .[0:200]
            ' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "[]")"
            echo "Changed files from push event: $(jq -r 'length' <<<"$files_json")."
          fi

          # Deliberately NOT falling back to `git show --name-only`: against a
          # shallow clone the head commit has no parent, so git reports the whole
          # tree as added — turning "5 files changed" into the entire repo. An
          # empty list leaves whatever the report itself claimed, which is far
          # better than a confidently wrong one.
          if [ "$(jq -r 'length' <<<"$files_json" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "::notice::Could not determine changed files — leaving the report's own list."
          fi

          # Is entries[0] actually about THIS push?
          #
          # The file existing is not enough. Left at that, a push where nobody
          # wrote an entry re-sends the previous one — its title, its summary,
          # its blockers — stamped with this commit and this push's file list.
          # Old work is then reported as new, and a blocker that was resolved
          # last week reappears as current. That is worse than the stub, because
          # a stub is visibly thin and a stale entry is indistinguishable from a
          # real one.
          #
          # reports/report.json changing in this push is the evidence, and the
          # file list above already says so. Only trust that when the list is
          # non-empty: an empty list means we could not tell, and guessing
          # "stale" there would throw away a perfectly good report.
          if [ "$use_fallback" -eq 0 ]              && [ "$(jq -r 'length' <<<"$files_json" 2>/dev/null || echo 0)" -gt 0 ]; then
            if ! jq -e --arg f "$report_file" 'any(.[]; . == $f)' <<<"$files_json" >/dev/null 2>&1; then
              use_fallback=1
              echo "::notice::$report_file did not change in this push, so entries[0] describes earlier work. Sending a stub built from the commit instead."
            fi
          fi

          if [ "$use_fallback" -eq 0 ]; then
            # Flatten the newest entry into the wire shape the dashboard reads.
            report_json="$(jq -c '.entries[0] | {
              schema_version: 2,
              title: .title,
              summary: .summary,
              why: (.why // ""),
              what_changed: (.what_changed // []),
              decisions: (.decisions // []),
              verification: (.verification // []),
              files_changed: (.files_changed // []),
              blockers: (.blockers // []),
              next_steps: (.next_steps // []),
              area: (.area // "other"),
              type: (.type // "chore"),
              generated_by: (.generated_by // "claude-code"),
              generated_at: .timestamp
            }' "$report_file")"

            # GitHub's file list wins over whatever the entry claimed.
            if [ "$(jq -r 'length' <<<"$files_json")" -gt 0 ]; then
              report_json="$(jq -c --argjson files "$files_json" \
                '.files_changed = $files' <<<"$report_json")"
            fi
          else
            title="$(printf '%s' "$COMMIT_MESSAGE" | head -n1)"
            report_json="$(jq -nc \
              --arg title "${title:-Push with no commit message}" \
              --argjson files "$files_json" \
              '{
                schema_version: 2,
                title: ($title | .[0:120]),
                summary: "",
                why: "",
                what_changed: [],
                decisions: [],
                verification: [],
                files_changed: $files,
                blockers: [],
                next_steps: [],
                area: "other",
                type: "chore",
                generated_by: "fallback",
                generated_at: (now | todate)
              }')"
          fi

          # The repo's README, so the dashboard can show what a project IS and
          # not only what changed. Taken from the checkout rather than fetched
          # from the API, which keeps it working for private repos with no
          # extra token and in step with this exact commit.
          readme_file=""
          for candidate in README.md readme.md README.MD Readme.md README.markdown README.txt README; do
            if [ -f "$candidate" ]; then readme_file="$candidate"; break; fi
          done

          # Read through FILES, never through command-line arguments. A big
          # README or a megabyte of base64 screenshots passed via --argjson
          # exceeds the argument size limit and kills this step silently — the
          # job still reports success because it is continue-on-error, and the
          # send step never runs.
          : > /tmp/readme.txt
          if [ -n "$readme_file" ]; then
            size="$(wc -c < "$readme_file")"
            if [ "$size" -le 200000 ]; then
              cp "$readme_file" /tmp/readme.txt
              echo "Including $readme_file (${size} bytes)."
            else
              echo "::notice::$readme_file is ${size} bytes — too large to send, skipping."
            fi
          else
            echo "::notice::No README found."
          fi

          # Screenshots from docs/screenshots/. The folder is the source of
          # truth: whatever is there replaces whatever the dashboard has, so
          # deleting one from the repo removes it there too.
          # Two writers must never share this field. When the project captures
          # in CI the screenshots job owns it, so the folder is not read and the
          # key is dropped from the payload below — otherwise this job would
          # send [] and wipe what the capture job just uploaded.
          shots_dir="docs/screenshots"
          tmp_shots=/tmp/shots.json
          echo '[]' > "$tmp_shots"
          if [ -d "$shots_dir" ] && [ ! -f docs/screenshots.config.json ]; then
            total=0
            count=0
            # Sorted so `01-login.png` reliably precedes `02-overview.png`.
            while IFS= read -r img; do
              [ -f "$img" ] || continue
              if [ "$count" -ge 12 ]; then
                echo "::notice::More than 12 screenshots — sending the first 12."
                break
              fi
              bytes="$(wc -c < "$img")"
              if [ "$bytes" -gt 2000000 ]; then
                echo "::warning::$(basename "$img") is ${bytes} bytes — over 2 MB, skipped."
                continue
              fi
              if [ "$((total + bytes))" -gt 10000000 ]; then
                echo "::notice::Screenshot payload would exceed 10 MB — stopping here."
                break
              fi
              case "${img##*.}" in
                png|PNG) ctype="image/png" ;;
                jpg|jpeg|JPG|JPEG) ctype="image/jpeg" ;;
                webp|WEBP) ctype="image/webp" ;;
                gif|GIF) ctype="image/gif" ;;
                *) continue ;;
              esac
              base64 -w0 "$img" > /tmp/shot.b64
              jq -c --arg name "$(basename "$img")" --arg ct "$ctype" \
                    --rawfile data /tmp/shot.b64 \
                    '. + [{filename: $name, content_type: $ct, data: ($data | rtrimstr("\n"))}]' \
                    "$tmp_shots" > "$tmp_shots.new" && mv "$tmp_shots.new" "$tmp_shots"
              total=$((total + bytes))
              count=$((count + 1))
            done <<< "$(find "$shots_dir" -maxdepth 1 -type f | sort)"
            rm -f /tmp/shot.b64
            echo "Including ${count} screenshot(s), ${total} bytes."
          fi

          jq -nc \
            --arg repo "$REPO" \
            --arg developer "$DEVELOPER" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg run_url "$RUN_URL" \
            --arg pushed_at "$pushed_at" \
            --argjson report "$report_json" \
            --rawfile readme /tmp/readme.txt \
            --slurpfile screenshots /tmp/shots.json \
            '{
              repo: $repo,
              developer: $developer,
              branch: $branch,
              commit: $commit,
              commit_message: ($commit_message | .[0:2000]),
              run_url: $run_url,
              pushed_at: $pushed_at,
              report: $report,
              readme: $readme,
              screenshots: $screenshots[0]
            }' > /tmp/payload.json

          # Attach the PDF as a second pass rather than branching the jq filter
          # above — one code path builds the payload, one optionally adds to it.
          if [ -f "reports/report.pdf" ]; then
            size="$(wc -c < reports/report.pdf)"
            if [ "$size" -le 2000000 ]; then
              base64 -w0 reports/report.pdf > /tmp/pdf.b64
              if jq -c --rawfile pdf /tmp/pdf.b64 \
                   '. + {pdf_base64: ($pdf | rtrimstr("\n"))}' \
                   /tmp/payload.json > /tmp/payload.with-pdf.json; then
                mv /tmp/payload.with-pdf.json /tmp/payload.json
              else
                echo "::warning::Could not attach reports/report.pdf — sending the report without it."
              fi
            else
              echo "::warning::reports/report.pdf is ${size} bytes — over the 2 MB limit, skipping attachment."
            fi
          fi

          # Absent means "leave them alone"; [] means "this project has none".
          if [ -f docs/screenshots.config.json ]; then
            if jq -c 'del(.screenshots)' /tmp/payload.json > /tmp/payload.noshots.json; then
              mv /tmp/payload.noshots.json /tmp/payload.json
              echo "Screenshots are captured by the screenshots job — not sent from here."
            fi
          fi

          echo "Payload is $(wc -c < /tmp/payload.json) bytes."

      - name: Send to dashboard
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${DASHBOARD_URL:-}" ] || [ -z "${REPORT_TOKEN:-}" ]; then
            echo "::warning::DASHBOARD_URL or REPORT_TOKEN is not set — skipping. Re-run the setup skill in this repo."
            exit 0
          fi

          # -m 15 caps the whole request. Any failure is reported and swallowed:
          # the build's success does not depend on the dashboard being up.
          status="$(curl -s -o /tmp/response.txt -w '%{http_code}' \
            -m 15 --retry 2 --retry-connrefused \
            -X POST "${DASHBOARD_URL%/}/api/report" \
            -H "Authorization: Bearer ${REPORT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)" || status="000"

          case "$status" in
            2*) echo "Report delivered (HTTP $status)." ;;
            000) echo "::warning::Dashboard unreachable or timed out. Build unaffected." ;;
            401|403) echo "::warning::Dashboard rejected the credential (HTTP $status). Re-run the setup skill in this repo." ;;
            409) echo "::warning::This credential is bound to a different repository (HTTP 409)." ;;
            *) echo "::warning::Dashboard returned HTTP $status: $(head -c 300 /tmp/response.txt)" ;;
          esac

          exit 0

  # Screenshots are a SEPARATE job on purpose. Capturing means installing,
  # building and starting the whole project, which takes minutes and fails for
  # reasons that have nothing to do with reporting. Sharing a job would put all
  # of that between a push and its report.
  #
  # Default branch only: rebuilding an app on every feature-branch push, to
  # photograph screens nobody is reviewing yet, costs real money.
  screenshots:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    continue-on-error: true
    timeout-minutes: 20

    # A newer push makes an in-flight capture pointless — it would upload the
    # previous commit's screens over the current ones.
    concurrency:
      group: screenshots-${{ github.repository }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Is this project configured for screenshots?
        id: check
        run: |
          if [ -f docs/screenshots.config.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No docs/screenshots.config.json — this project does not publish screenshots."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 20

      - name: Start the app and capture
        if: steps.check.outputs.run == 'true'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # Named by docs/screenshots.config.json when the pages need a login.
          # Absent on a public site, and absent secrets are simply skipped.
          # ONE mechanism, because what an app needs to boot differs per project
          # and cannot be listed here: any repo secret named SCREENSHOT_ENV_FOO
          # is handed to the app, and to the capture, as FOO. Naming specific
          # secrets in this file would mean editing the workflow for every
          # project — and a workflow nobody may edit is the point of a template.
          #
          # The prefix is the opt-in: only secrets deliberately marked for this
          # reach the process, not the repository's whole secret store.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -uo pipefail

          cfg=docs/screenshots.config.json

          # Written to a file and sourced rather than eval'd, so a value
          # containing quotes or $( ) is data and never shell.
          node -e '
            const all = JSON.parse(process.env.ALL_SECRETS || "{}");
            const out = [];
            for (const [k, v] of Object.entries(all)) {
              if (!k.startsWith("SCREENSHOT_ENV_")) continue;
              out.push(k.slice("SCREENSHOT_ENV_".length) + "=" + JSON.stringify(String(v)));
            }
            const nl = String.fromCharCode(10);
            require("fs").writeFileSync("/tmp/app.env", out.join(nl) + nl);
            console.log("Passing " + out.length + " SCREENSHOT_ENV_* secret(s) to the app.");
          '
          set -a
          # shellcheck disable=SC1091
          . /tmp/app.env
          set +a
          unset ALL_SECRETS

          # A project declares what it cannot start without. Checked here so a
          # missing secret is named, rather than surfacing three minutes later
          # as "the app did not respond on port 3000", which says nothing about
          # the cause and sends people to look at their code.
          missing=""
          for name in $(node -e "
            const c = JSON.parse(require('fs').readFileSync('$cfg','utf8'));
            process.stdout.write((c.requires || []).join(' '));
          "); do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::warning::This project cannot start without:$missing"
            for name in $missing; do
              echo "  add a repository secret named SCREENSHOT_ENV_${name}"
            done
            echo "Skipping capture. The dashboard keeps the screenshots it already has."
            exit 0
          fi

          read_cfg() { node -e "process.stdout.write(String((JSON.parse(require('fs').readFileSync('$cfg','utf8'))['$1'] ?? '$2')))"; }

          install_cmd="$(read_cfg install 'npm ci')"
          build_cmd="$(read_cfg build '')"
          start_cmd="$(read_cfg start 'npm start')"
          port="$(read_cfg port 3000)"
          ready_path="$(read_cfg readyPath /)"

          # Each command runs in a SUBSHELL so it starts from the repository
          # root. Without this a `cd` in the install command leaks into the
          # build command, and a config that says `cd app && ...` in both --
          # the obvious thing to write -- fails on the second one with
          # "No such file or directory", naming a directory that plainly exists.
          echo "::group::Install"
          ( eval "$install_cmd" ) || { echo "::warning::Install failed — cannot capture."; exit 0; }
          echo "::endgroup::"

          if [ -n "$build_cmd" ]; then
            echo "::group::Build"
            ( eval "$build_cmd" ) || { echo "::warning::Build failed — cannot capture."; exit 0; }
            echo "::endgroup::"
          fi

          # Installed into its own directory, never into the project. Adding a
          # dependency to someone's package.json to take a screenshot is rude,
          # can conflict with what they already pin, and dirties the tree. A
          # global install would not work either: `import("playwright")` from a
          # script in the repo does not resolve global packages.
          export PLAYWRIGHT_DIR=/tmp/pw
          mkdir -p "$PLAYWRIGHT_DIR"
          npm i --prefix "$PLAYWRIGHT_DIR" --no-save --silent playwright@1             || { echo "::warning::Could not install Playwright."; exit 0; }
          # Chromium only, and not --with-deps: the runner already carries the
          # shared libraries it needs, and installing them again is a minute of
          # apt for nothing.
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install chromium             || { echo "::warning::Could not install a browser."; exit 0; }

          echo "Starting: $start_cmd"
          # setsid puts the app in its own process group, so the whole tree can
          # be stopped afterwards. A dev server usually spawns children, and
          # killing only the shell leaves them holding the port.
          setsid bash -c "$start_cmd" > /tmp/app.log 2>&1 &
          app_pid=$!

          # Wait for the app rather than sleeping a guessed amount. An app that
          # never comes up is a warning, not a failed build.
          up=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:${port}${ready_path}"; then up=1; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 2
          done

          if [ "$up" -ne 1 ]; then
            echo "::warning::App did not respond on port ${port} within 120s. Last 40 lines:"
            tail -40 /tmp/app.log || true
            kill -TERM -"$app_pid" 2>/dev/null || kill "$app_pid" 2>/dev/null || true
            exit 0
          fi

          node .github/capture-screenshots.mjs || echo "::warning::Capture step reported a problem."
          kill -TERM -"$app_pid" 2>/dev/null || kill "$app_pid" 2>/dev/null || true
          exit 0
